<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="640" fill="#F4F1EA"/>
  <text x="490" y="36" text-anchor="middle" font-size="18" fill="#1A1D21" font-weight="600">place(clause, playbook, deal_context)</text>

  <rect x="340" y="60" width="300" height="46" fill="#FBFAF6" stroke="#1A1D21" stroke-width="1.5"/>
  <text x="490" y="88" text-anchor="middle" font-size="13">extract(clause) -extract(clause) &#8594; attrsgt; attrs</text>
  <path d="M490 106 V 130" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="320" y="130" width="340" height="46" fill="#FBFAF6" stroke="#1A1D21" stroke-width="1.5"/>
  <text x="490" y="158" text-anchor="middle" font-size="13">ladder = positions, filtered by applies_when</text>
  <path d="M490 176 V 200" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="280" y="200" width="420" height="46" fill="#FBFAF6" stroke="#1A1D21" stroke-width="1.5"/>
  <text x="490" y="228" text-anchor="middle" font-size="13">matched = first position whose conditions pass</text>
  <path d="M490 246 V 270" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- decision diamond -->
  <polygon points="490,270 610,320 490,370 370,320" fill="#FBFAF6" stroke="#9A5B00" stroke-width="1.5"/>
  <text x="490" y="316" text-anchor="middle" font-size="12">matched is</text>
  <text x="490" y="332" text-anchor="middle" font-size="12">rank 0?</text>

  <!-- yes branch -->
  <path d="M610 320 H 760" stroke="#1E5B4A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="685" y="310" text-anchor="middle" font-size="11" fill="#1E5B4A">yes</text>
  <rect x="760" y="296" width="180" height="48" fill="#FBFAF6" stroke="#1E5B4A" stroke-width="1.5"/>
  <text x="850" y="314" text-anchor="middle" font-size="12" fill="#1E5B4A">No change needed</text>
  <text x="850" y="330" text-anchor="middle" font-size="11" fill="#5A5F66">(in playbook)</text>

  <!-- no branch -->
  <path d="M490 370 V 400" stroke="#A3271F" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="505" y="388" font-size="11" fill="#A3271F">no</text>

  <!-- matched is None check -->
  <polygon points="490,400 630,450 490,500 350,450" fill="#FBFAF6" stroke="#A3271F" stroke-width="1.5"/>
  <text x="490" y="446" text-anchor="middle" font-size="12">matched is None</text>
  <text x="490" y="462" text-anchor="middle" font-size="12">(worse than walk-away)?</text>

  <path d="M630 450 H 800" stroke="#A3271F" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="715" y="440" text-anchor="middle" font-size="11" fill="#A3271F">yes</text>
  <rect x="800" y="420" width="150" height="60" fill="#FBFAF6" stroke="#A3271F" stroke-width="1.5"/>
  <text x="875" y="442" text-anchor="middle" font-size="12" fill="#A3271F">Outside playbook</text>
  <text x="875" y="458" text-anchor="middle" font-size="11" fill="#5A5F66">target = walk-away,</text>
  <text x="875" y="472" text-anchor="middle" font-size="11" fill="#5A5F66">escalate</text>

  <path d="M490 500 V 530" stroke="#1E5B4A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="505" y="518" font-size="11" fill="#1E5B4A">no</text>

  <rect x="260" y="530" width="460" height="56" fill="#FBFAF6" stroke="#1E5B4A" stroke-width="1.5"/>
  <text x="490" y="552" text-anchor="middle" font-size="13" fill="#1E5B4A" font-weight="600">target = best unrejected position ahead of matched,</text>
  <text x="490" y="570" text-anchor="middle" font-size="13" fill="#1E5B4A" font-weight="600">strictly better on &#8805; 1 attribute</text>

  <path d="M490 586 V 610" stroke="#1A1D21" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="330" y="610" width="320" height="26" fill="#13202B"/>
  <text x="490" y="628" text-anchor="middle" font-size="12" fill="#FBFAF6" font-family="monospace">redline = minimal_diff(clause, target)</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1D21"/>
    </marker>
  </defs>
</svg>
