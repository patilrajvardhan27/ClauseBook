[project]
name = "clausebook"
version = "0.1.0"
description = "Contract review that knows a firm's playbook."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "opensearch-py>=2.7",
    "diff-match-patch>=20230430",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]
ml = ["torch>=2.5", "transformers>=4.46", "onnx>=1.17", "onnxruntime>=1.20", "datasets>=3.1"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clausebook_core*"]
where = ["libs"]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends() in a default argument is the framework's documented pattern

[tool.pytest.ini_options]
markers = [
    "integration: requires a live Postgres, set via CLAUSEBOOK_DATABASE_URL",
    "opensearch: requires a live, seeded Postgres and OpenSearch stack",
]
